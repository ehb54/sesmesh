name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make

      - name: Test
        run: make test

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (clang, no OpenMP)
        run: make CXX=clang++ OPENMP=

      - name: Test
        run: make test CXX=clang++ OPENMP=
